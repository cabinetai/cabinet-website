<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-icon.png">
<script src="../readonly.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fact Check Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800;900&family=Atkinson+Hyperlegible:wght@400;700&family=Martian+Mono:wght@400;600&family=Noto+Sans+Devanagari:wght@400..800&display=swap" rel="stylesheet">
<style>
  /* A polygraph printout: chart paper, ink, and a pen that settles on a verdict. */
  :root{
    --paper:#f4f7f2; --grid:#dfe9e1; --grid-major:#cbdccf; --line:#c9d8cd; --white:#fff;
    --ink:#14211b; --ink-2:#4c5d54; --ink-3:#7f9187;
    --true:#1f8a4c; --misleading:#c77d00; --false:#d6332a;
    --display:'Schibsted Grotesk','Noto Sans Devanagari',system-ui,sans-serif;
    --sans:'Atkinson Hyperlegible','Noto Sans Devanagari',system-ui,sans-serif;
    --mono:'Martian Mono',ui-monospace,monospace;
    --hi:'Noto Sans Devanagari','Atkinson Hyperlegible',sans-serif;
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
      linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:120px 120px,120px 120px,24px 24px,24px 24px}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
  .hi{font-family:var(--hi)}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 28px 80px}
  .mono{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}

  /* Header */
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
  .home{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-decoration:none;margin-bottom:14px}
  .home:hover{color:var(--ink)}
  h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,5vw,54px);line-height:.95;letter-spacing:-.03em}
  .sub{margin-top:8px;color:var(--ink-2);font-size:16px}
  .side{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
  .langs{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--white);border:1px solid var(--line)}
  .langs button{font-size:12.5px;color:var(--ink-2);padding:4px 10px;border-radius:6px}
  .langs button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
  .langs button[lang=hi]{font-family:var(--hi)}
  :lang(hi) .mono,:lang(hi) .conf,:lang(hi) .lanes span,:lang(hi) .back,:lang(hi) .home,:lang(hi) .lg span,:lang(hi) .tag,:lang(hi) .r-kicker,:lang(hi) .box h3{letter-spacing:0;text-transform:none;font-family:var(--hi);font-size:12.5px}
  .legend{display:flex;gap:18px;padding-bottom:4px}
  .lg{display:flex;align-items:center;gap:8px}
  .lg i{width:18px;height:3px;border-radius:2px;background:var(--c)}
  .lg b{font-family:var(--display);font-size:20px;font-weight:800;line-height:1}
  .lg span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

  /* Composer */
  .composer{background:var(--white);border:1.5px solid var(--ink);border-radius:16px;padding:20px 22px 18px;margin-bottom:34px;box-shadow:6px 6px 0 var(--grid-major)}
  .composer label{display:block;color:var(--ink-2);margin-bottom:8px}
  .composer textarea{width:100%;min-height:72px;resize:none;border:none;outline:none;background:transparent;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.25;letter-spacing:-.015em}
  .composer textarea::placeholder{color:#a9b8ae}
  .composer-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:12px;flex-wrap:wrap}
  .examples{display:flex;gap:8px;flex-wrap:wrap}
  .examples button{font-size:13.5px;color:var(--ink-2);border:1px dashed var(--line);border-radius:999px;padding:6px 12px;background:var(--paper);transition:color .15s,border-color .15s}
  .examples button:hover{color:var(--ink);border-color:var(--ink-3)}
  .go{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--white);font-family:var(--display);font-weight:800;font-size:16px;padding:12px 22px;border-radius:11px;transition:transform .15s var(--ease-out),opacity .2s}
  .go:active{transform:scale(.97)}
  .go:disabled{opacity:.35;cursor:default}
  .go kbd{font-family:var(--mono);font-size:10.5px;opacity:.6}
  .note{font-size:13.5px;color:var(--ink-2);margin-top:10px;min-height:20px}
  .note.err{color:var(--false)}

  /* The polygraph strip */
  .strip{position:relative;background:var(--paper);border-radius:10px;overflow:hidden;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px}
  .strip svg{display:block;width:100%;height:100%}
  .strip .lane{stroke:var(--grid-major);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
  .strip .pen{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .strip .pen.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.7s cubic-bezier(.4,0,.2,1)}
  .strip .pen.draw.go-now{stroke-dashoffset:0}
  .lanes{position:absolute;inset:0;pointer-events:none}
  .lanes span{position:absolute;right:10px;transform:translateY(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--paper);padding:1px 5px;border-radius:4px}
  .lanes span.on{color:var(--white);background:var(--c)}

  /* Wall */
  .section-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
  .section-h h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
  .card{position:relative;text-align:left;display:flex;flex-direction:column;background:var(--white);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .2s var(--ease-out),border-color .2s,box-shadow .2s}
  .card:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:5px 5px 0 var(--grid-major)}
  .card:active{transform:scale(.99)}
  .card .strip{height:74px;border-radius:0}
  .card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .verdict{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
  .verdict::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
  .conf{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
  .card .claim{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.28;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .headline{color:var(--ink-2);font-size:14px}
  .card .meta{display:flex;gap:14px;color:var(--ink-3)}
  .card.fresh{animation:land .6s var(--ease-out) both}
  @keyframes land{from{opacity:0;transform:translateY(14px)}}
  .card.pending{border-style:dashed;border-color:var(--ink-3)}
  .card.pending:hover{transform:none;box-shadow:none}
  .card.pending .strip svg{width:200%;animation:scroll 3.2s linear infinite}
  @keyframes scroll{to{transform:translateX(-50%)}}
  .shimmer{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--paper),var(--grid-major),var(--paper));background-size:200% 100%;animation:shine 1.4s linear infinite}
  @keyframes shine{to{background-position:-200% 0}}
  .empty{border:1.5px dashed var(--ink-3);border-radius:16px;padding:48px;text-align:center;color:var(--ink-2);background:rgba(255,255,255,.6)}

  /* Detail */
  .detail{position:fixed;inset:0;z-index:30;background:rgba(244,247,242,.86);backdrop-filter:blur(6px);overflow:auto;opacity:0;pointer-events:none;transition:opacity .22s var(--ease-out)}
  .detail.open{opacity:1;pointer-events:auto}
  .sheet{max-width:1200px;margin:22px auto;padding:0 28px 40px;transform:translateY(12px);transition:transform .3s var(--ease-out)}
  .detail.open .sheet{transform:none}
  .back{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:8px 0;margin-bottom:10px}
  .back:hover{color:var(--ink)}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
  @media (max-width:980px){.layout{grid-template-columns:1fr}}
  .box{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:22px}
  .box + .box{margin-top:14px}
  .box h3{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .hero{border-color:var(--ink);box-shadow:6px 6px 0 var(--grid-major)}
  .big-claim{font-family:var(--display);font-weight:800;font-size:clamp(24px,3vw,32px);line-height:1.15;letter-spacing:-.02em}
  .hero .strip{height:170px;margin:20px 0 16px}
  .readout{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .readout .word{font-family:var(--display);font-weight:900;font-size:clamp(34px,5vw,56px);line-height:.9;letter-spacing:-.02em;text-transform:uppercase;color:var(--c);opacity:0;transform:translateY(8px);transition:opacity .4s 1.5s,transform .5s var(--ease-out) 1.5s}
  .detail.open .readout .word{opacity:1;transform:none}
  .readout .head{font-size:16px;color:var(--ink);max-width:460px}

  .lang{display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:3px}
  .lang button{font-family:var(--sans);font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--ink-2);padding:4px 10px;border-radius:6px}
  .lang button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,27,.12)}
  .summary{font-size:17px;line-height:1.65}
  .summary.hi{font-size:17.5px;line-height:1.85}

  .sources{display:grid;gap:10px}
  .src{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px;border-radius:12px;border:1px solid var(--line);text-decoration:none;transition:border-color .15s}
  .src:hover{border-color:var(--ink-3)}
  .fav{width:34px;height:34px;border-radius:8px;background:var(--paper);display:grid;place-items:center;overflow:hidden}
  .fav img{width:18px;height:18px}
  .src .pub{color:var(--ink-3)}
  .src .t{font-weight:700;margin:2px 0 6px}
  .src q{display:block;color:var(--ink-2);font-size:14px;border-left:3px solid var(--c);padding-left:10px}
  .tag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);white-space:nowrap}

  .timeline{position:relative;display:grid;gap:16px;padding-left:22px}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .ev{position:relative}
  .ev::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--white);border:2px solid var(--ink)}
  .ev .d{color:var(--ink-2)}
  .ev .e{margin-top:2px}

  /* Reel card: the printout, made for a 9:16 post */
  .reel-wrap{position:sticky;top:22px}
  .reel{--w:360px;width:var(--w);aspect-ratio:9/16;border-radius:20px;overflow:hidden;position:relative;display:flex;flex-direction:column;padding:calc(var(--w)*.075);font-size:calc(var(--w)*.037);
    color:var(--ink);background-color:var(--paper);border:1.5px solid var(--ink);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:calc(var(--w)*.05) calc(var(--w)*.05)}
  .r-kicker{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.68em;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  .r-claim{margin-top:1.4em;font-family:var(--display);font-weight:800;font-size:1.75em;line-height:1.14;letter-spacing:-.02em}
  .r-claim.struck{text-decoration:line-through;text-decoration-color:var(--false);text-decoration-thickness:.11em}
  .r-strip{margin:1.2em calc(var(--w)*-.075) 0;height:4.6em;position:relative}
  .r-strip svg{display:block;width:100%;height:100%}
  .r-strip .lane{stroke:var(--grid-major);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
  .r-strip .pen{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .r-word{margin-top:.5em;font-family:var(--display);font-weight:900;font-size:3.5em;line-height:.9;letter-spacing:-.02em;text-transform:uppercase;color:var(--c)}
  .r-headline{margin-top:.6em;font-family:var(--display);font-weight:700;font-size:1.25em;line-height:1.2}
  .r-hi{margin-top:.6em;font-family:var(--hi);font-size:.95em;line-height:1.6;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .r-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:1em;font-size:.8em}
  .r-src{font-family:var(--mono);font-size:.82em;line-height:1.7;color:var(--ink-2)}
  .r-handle{font-family:var(--display);font-weight:800;font-size:1.25em;white-space:nowrap}

  .reel-tools{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 12px;border-radius:11px;border:1.5px solid var(--ink);background:var(--ink);color:var(--white);font-family:var(--display);font-weight:800;font-size:14px;transition:transform .15s var(--ease-out)}
  .btn:active{transform:scale(.97)}
  .handle-in{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
  .handle-in input{flex:1;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none}
  .handle-in input:focus{border-color:var(--ink)}
  .caption{white-space:pre-line;font-size:14px;line-height:1.6;padding:12px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}
  .caption + .caption{margin-top:10px}
  .caption .hi{font-size:15px}
  .cap-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--ink-2)}
  .copy{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--white)}
  .copy:hover{border-color:var(--ink)}

  .present{position:fixed;inset:0;z-index:50;background:var(--paper);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s}
  .present.open{opacity:1;pointer-events:auto}
  .present .reel{--w:min(calc((100vh - 48px) * 9 / 16),calc(100vw - 48px))}
  .present-x{position:fixed;top:16px;right:20px;color:var(--ink-2)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:var(--white);font-weight:700;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s,transform .3s var(--ease-out);z-index:60;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:640px){
    .wrap{padding:16px 14px 60px}
    .composer textarea{font-size:21px}
    .sheet{padding:0 14px 30px}
    .reel{--w:min(360px,calc(100vw - 28px))}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .strip .pen.draw{stroke-dashoffset:0}
    .readout .word{opacity:1;transform:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <a class="home" id="home" href="#" data-t="home">← Creator Hub</a>
      <h1>Fact Check Studio</h1>
      <p class="sub" data-t="sub">Paste a claim. Get the receipts.</p>
    </div>
    <div class="side"><div class="langs" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">English</button><button type="button" data-lang="hi" lang="hi" aria-pressed="false">हिन्दी</button></div><div class="legend" id="tally" aria-label="Checks by verdict"></div></div>
  </header>

  <section class="composer">
    <label class="mono" for="claim" data-t="claimLabel">A claim you saw going around</label>
    <textarea id="claim" rows="2" placeholder="Paste a WhatsApp forward, a tweet, a headline..." data-t-ph="claimPh"></textarea>
    <div class="composer-foot">
      <div class="examples" id="examples"></div>
      <button class="go" id="go" disabled><span data-t="checkIt">Check it</span> <kbd>⌘↵</kbd></button>
    </div>
    <div class="note" id="note" role="status"></div>
  </section>

  <div class="section-h"><h2 data-t="checkedSoFar">Checked so far</h2><span class="conf mono" id="count"></span></div>
  <div class="grid" id="grid"></div>
</div>

<div class="detail" id="detail" aria-hidden="true"><div class="sheet" id="sheet"></div></div>
<div class="present" id="present"><button class="present-x mono" id="present-x" data-t="escClose">Esc to close</button><div id="present-card"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var VERDICTS = {
    "true": { key: "true", color: "var(--true)", lane: 0.2 },
    "misleading": { key: "misleading", color: "var(--misleading)", lane: 0.5 },
    "false": { key: "false", color: "var(--false)", lane: 0.8 }
  };
  var STANCE = {
    supports: { key: "supports", color: "var(--true)" },
    contradicts: { key: "contradicts", color: "var(--false)" },
    context: { key: "context", color: "var(--ink-3)" }
  };
  /* ---------- Language ---------- */
  // One setting for every app in this cabinet: the hub and each tool read the same key.
  var LANG_KEY = "india-creators-2026:lang";
  var STR = {
    en: {
      home: "← Creator Hub", sub: "Paste a claim. Get the receipts.",
      claimLabel: "A claim you saw going around", claimPh: "Paste a WhatsApp forward, a tweet, a headline...", checkIt: "Check it",
      examples: ["Israel has more startups per person than any other country.", "Tel Aviv has more vegans per person than any other city.", "Drip irrigation was invented in Israel."],
      checkedSoFar: "Checked so far", check: "{n} check", checks: "{n} checks",
      "true": "True", misleading: "Misleading", "false": "False",
      supports: "Supports", contradicts: "Contradicts", context: "Context",
      readingSources: "Reading sources", sure: "{n}% sure", confident: "{n}% confident", sources: "{n} sources",
      justNow: "just now", minAgo: "{n} min ago", hAgo: "{n} h ago", dAgo: "{n} d ago",
      empty: "Nothing checked yet. Paste a claim above and press Check it.",
      back: "← Back to the checks", whatsTrue: "What is actually true", receipts: "The receipts", spread: "How it spread",
      fullScreen: "Full screen for recording", yourHandle: "Your handle", captions: "Captions", english: "English", hindi: "Hindi", copy: "Copy",
      copied: "Caption copied", factCheck: "Fact check", escClose: "Esc to close",
      onIt: "The fact checker is on it. Watch it work in the chat beside this page.",
      stillOn: "The fact checker is still on it. The result opens here when it lands.",
      stopped: "This check stopped before it finished. Paste the claim again to retry.",
      noChecker: "Could not reach the fact checker.", needCabinetCheck: "Open this app inside Cabinet to check a claim.",
      needCabinet: "Open this app inside Cabinet to see the checks.", noReach: "This page could not reach Cabinet.",
      noFolder: "Could not read the {dir} folder."
    },
    hi: {

    setNote(t("needCabinet"), true);
  }
})();
