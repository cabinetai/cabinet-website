<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<script src="../readonly.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comment Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Devanagari:wght@400..800&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --key:#1238d6; --ink:#0b1033; --paper:#f2f4fb; --marigold:#ffb21e; --rec:#ff3b30; --rule:#cdd3ee;
    --ink-2:#4a5180; --ink-3:#7d84ad; --white:#fff; --wash:#e6eafb;
    --display:'Archivo','Noto Sans Devanagari',system-ui,sans-serif;
    --sans:'Instrument Sans','Noto Sans Devanagari','Noto Sans Kannada','Noto Sans Tamil',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,input{font:inherit;color:inherit;border:none;background:none}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--marigold);outline-offset:3px;border-radius:6px}
  .page{max-width:1240px;margin:0 auto;padding:22px 24px 80px}

  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
  .home{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:6px 0}
  .home:hover{color:var(--key)}
  .title{display:flex;align-items:baseline;gap:14px}
  h1{font-family:var(--display);font-stretch:125%;font-weight:850;font-size:34px;letter-spacing:-.02em;line-height:1}
  .title p{color:var(--ink-2)}
  .right{display:flex;align-items:center;gap:14px}
  .langs{display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--white);border:1px solid var(--rule)}
  .langs button{font-size:12.5px;color:var(--ink-2);padding:4px 10px;border-radius:6px}
  .langs button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
  .langs button[lang=hi]{font-family:'Noto Sans Devanagari',var(--sans)}
  :lang(hi) .home,:lang(hi) .stat span,:lang(hi) .tr b,:lang(hi) .reply div b,:lang(hi) .ch,:lang(hi) .mood-key,:lang(hi) .idea small{letter-spacing:0;text-transform:none;font-family:'Noto Sans Devanagari',var(--sans);font-size:12.5px}

  /* Composer */
  .composer{display:flex;gap:10px;align-items:center;background:var(--white);border:1.5px solid var(--rule);border-radius:18px;padding:10px 10px 10px 12px;transition:border-color .2s,box-shadow .2s}
  .composer:focus-within{border-color:var(--key);box-shadow:0 0 0 4px rgba(18,56,214,.12)}
  .peek{width:0;height:42px;border-radius:8px;background:var(--wash) center/cover;flex-shrink:0;transition:width .3s var(--ease-out)}
  .peek.on{width:75px}
  .composer input{flex:1;min-width:0;font-size:18px;font-weight:500;padding:10px 4px;outline:none}
  .composer input::placeholder{color:var(--ink-3)}
  .go{flex-shrink:0;background:var(--key);color:var(--white);font-family:var(--display);font-stretch:112%;font-weight:800;font-size:15px;padding:13px 20px;border-radius:12px;transition:transform .15s var(--ease-out),opacity .2s}
  .go:active{transform:scale(.97)}
  .go:disabled{opacity:.35;cursor:default}
  .note{min-height:20px;margin:8px 4px 0;font-size:13px;color:var(--ink-2)}
  .note.err{color:#c62a1f}

  /* History */
  .history{display:flex;gap:10px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:thin}
  .hist{flex-shrink:0;width:150px;text-align:left;border-radius:12px;padding:6px;border:1.5px solid transparent;transition:border-color .2s,background .2s}
  .hist:hover{background:var(--white)}
  .hist.on{border-color:var(--key);background:var(--white)}
  .hist .th{aspect-ratio:16/9;border-radius:8px;background:var(--wash) center/cover}
  .hist .ht{font-size:12px;font-weight:600;line-height:1.3;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .hist .hm{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px}

  /* Pending */
  .pending{margin-top:18px;display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:center;background:var(--white);border:1.5px dashed var(--rule);border-radius:20px;padding:18px}
  .pending .th{position:relative;aspect-ratio:16/9;border-radius:12px;background:var(--wash) center/cover;overflow:hidden}
  .pending .th::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,178,30,.55),transparent);animation:scan 1.6s var(--ease-out) infinite}
  @keyframes scan{from{left:-30%}to{left:100%}}
  .pending h3{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:22px}
  .pending p{color:var(--ink-2);margin-top:4px}
  @media (max-width:720px){.pending{grid-template-columns:1fr}}

  /* Result */
  .result{margin-top:18px}
  .video{display:grid;grid-template-columns:minmax(180px,360px) 1fr;gap:26px;background:var(--ink);color:var(--white);border-radius:22px;padding:20px;position:relative;overflow:hidden}
  @media (max-width:560px){.video{grid-template-columns:1fr}}
  @media (max-width:860px){.video h2{font-size:20px}.stat b{font-size:21px}.stats{gap:18px}}
  .video .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(30px) saturate(1.3);opacity:.35}
  .video > *{position:relative}
  .video .th{display:block;aspect-ratio:16/9;border-radius:14px;background:#1b2150 center/cover;box-shadow:0 18px 40px -16px rgba(0,0,0,.7)}
  .video .meta{display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-width:0}
  .video .ch{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
  .video h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.15;letter-spacing:-.01em;margin-top:6px}
  .stats{display:flex;gap:28px;flex-wrap:wrap}
  .stat b{display:block;font-family:var(--display);font-stretch:125%;font-weight:800;font-size:26px;line-height:1}
  .stat span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
  .mood{display:flex;height:10px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.12)}
  .mood i{display:block;height:100%}
  .mood-key{display:flex;gap:16px;margin-top:8px;font-family:var(--mono);font-size:11px;opacity:.8}
  .mood-key em{font-style:normal;display:inline-flex;align-items:center;gap:6px}
  .mood-key em::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}

  .summary{margin-top:16px;background:var(--white);border:1px solid var(--rule);border-radius:18px;padding:20px 22px;display:flex;gap:20px;align-items:flex-start;justify-content:space-between}
  .summary p{font-size:17px;line-height:1.6;max-width:820px}
  .summary p.hi{font-family:'Noto Sans Devanagari',var(--sans);font-size:17.5px;line-height:1.85}
  .lang{display:flex;gap:2px;background:var(--wash);border-radius:9px;padding:3px;flex-shrink:0}
  .lang button{font-size:12.5px;padding:5px 10px;border-radius:7px;color:var(--ink-2)}
  .lang button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 2px rgba(11,16,51,.12)}

  .cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;margin-top:18px;align-items:start}
  @media (max-width:980px){.cols{grid-template-columns:1fr}.side{order:-1;position:static;grid-template-columns:1fr 1fr}}
  @media (max-width:640px){.side{grid-template-columns:1fr}}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--rule);background:var(--white);color:var(--ink-2);transition:all .15s}
  .chip:hover{border-color:var(--ink-3)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--white)}
  .chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .chip small{font-family:var(--mono);font-size:11px;opacity:.7}

  .comments{display:grid;gap:12px}
  .cm{background:var(--white);border:1px solid var(--rule);border-radius:16px;padding:16px 18px;animation:rise .5s var(--ease-out) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  .cm-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px;color:var(--white);background:var(--c);flex-shrink:0}
  .who{font-weight:600}
  .when{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .likes{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2)}
  .cat{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
  .cm-t{margin-top:10px;font-size:16px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
  .cm-t mark{color:inherit;background:linear-gradient(transparent 12%,var(--marigold) 12%,var(--marigold) 88%,transparent 88%) no-repeat 0 0/0% 100%;padding:0 2px;border-radius:2px;animation:sweep .7s var(--ease-out) .35s forwards}
  @keyframes sweep{to{background-size:100% 100%}}
  .tr{margin-top:8px;padding-left:12px;border-left:2px solid var(--rule);color:var(--ink-2);font-size:14.5px}
  .tr b{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-right:6px}
  .why{margin-top:10px;font-size:13.5px;color:var(--key);font-weight:500}
  .reply{margin-top:12px;display:flex;gap:10px;align-items:flex-start;background:var(--paper);border-radius:12px;padding:10px 12px}
  .reply div{flex:1;font-size:14px;color:var(--ink-2)}
  .reply div b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:2px}
  .copy{flex-shrink:0;font-family:var(--mono);font-size:11px;font-weight:600;padding:5px 9px;border-radius:7px;border:1px solid var(--rule);background:var(--white)}
  .copy:hover{border-color:var(--ink-3)}

  .side{display:grid;gap:14px;position:sticky;top:18px}
  .panel{background:var(--white);border:1px solid var(--rule);border-radius:18px;padding:18px}
  .panel h3{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:17px;margin-bottom:14px}
  .theme + .theme{margin-top:14px}
  .theme-h{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
  .theme-h span{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
  .bar{height:6px;border-radius:99px;background:var(--wash);margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--key);border-radius:99px;transform-origin:left;animation:grow .8s var(--ease-out) both}
  @keyframes grow{from{transform:scaleX(0)}}
  .theme p{font-size:13px;color:var(--ink-2);margin-top:5px}
  .idea + .idea{margin-top:12px;padding-top:12px;border-top:1px solid var(--wash)}
  .idea-t{font-family:var(--display);font-weight:700;font-size:15.5px;line-height:1.3}
  .idea p{font-size:13px;color:var(--ink-2);margin-top:3px}
  .idea small{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink);background:var(--marigold);padding:2px 7px;border-radius:5px}

  .empty{margin-top:18px;border:1.5px dashed var(--rule);border-radius:20px;padding:56px 24px;text-align:center;color:var(--ink-2)}
  .empty b{display:block;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:22px;color:var(--ink);margin-bottom:6px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:var(--white);font-weight:600;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s,transform .3s var(--ease-out);pointer-events:none;z-index:9}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:640px){
    .page{padding:14px 12px 60px}
    .title p{display:none}
    h1{font-size:26px}
    .composer input{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .cm-t mark{background-size:100% 100%}
  }
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="title"><h1>Comment Reader</h1><p data-t="sub">The comments worth your time, from any YouTube video.</p></div>
    <div class="right"><div class="langs" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">English</button><button type="button" data-lang="hi" lang="hi" aria-pressed="false">हिन्दी</button></div>
    <a class="home" id="home" href="#" data-t="home">← Creator Hub</a></div>
  </header>

  <form class="composer" id="form" autocomplete="off">
    <div class="peek" id="peek"></div>
    <input id="url" type="url" inputmode="url" placeholder="Paste a YouTube link" aria-label="YouTube link" data-t-ph="urlPh" />
    <button class="go" id="go" type="submit" disabled data-t="read">Read comments</button>
  </form>
  <div class="note" id="note"></div>

  <div class="history" id="history"></div>
  <div id="view"></div>
</main>
<div class="toast" id="toast"></div>

<script>
(function () {
  var DIR = "comment-reader/analyses";
  var CATS = {
    question: { c: "#1238d6" },
    idea: { c: "#c77800" },
    feedback: { c: "#0f8a5f" },
    business: { c: "#7b3fe4" },
    superfan: { c: "#d6336c" },
    criticism: { c: "#c62a1f" }
  };
  var MOOD = { positive: "#2fbf71", mixed: "#ffb21e", negative: "#ff5a4e" };

  var c = window.cabinet;
  var $ = function (id) { return document.getElementById(id); };
  var list = [];
  var seen = null;
  var selected = null;
  var pending = null;
  var filter = "all";
  /* ---------- Language ---------- */
  // One setting for every app in this cabinet: the hub and each tool read the same key.
  var LANG_KEY = "india-creators-2026:lang";
  var STR = {
    en: {
      sub: "The comments worth your time, from any YouTube video.", home: "← Creator Hub", urlPh: "Paste a YouTube link", read: "Read comments",
      question: "Questions to answer", idea: "Video ideas", feedback: "Feedback", business: "Collab and business", superfan: "Superfans", criticism: "Criticism worth answering",
      positive: "Positive", mixed: "Mixed", negative: "Negative",
      readingTitle: "Reading the top comments", readingBody: "Fetching up to 300 comments and picking the ones worth answering. This takes a minute or two.",
      emptyTitle: "No videos read yet", emptyBody: "Paste a YouTube link above and press Read comments.",
      views: "Views", commentsRead: "Comments read", worth: "Worth your time", all: "All", likes: "{n} likes",
      english: "English", replyLabel: "Reply you could post", copy: "Copy", copied: "Reply copied", openVideo: "Open the video on YouTube",
      asking: "Videos they are asking for", talk: "What they talk about", askFor: "{n} comments ask for this",
      onIt: "The comment reader is on it. Watch it work in the chat beside this page.",
      stillOn: "The comment reader is still on it. The result opens here when it lands.",
      stopped: "This reading stopped before it finished. Paste the link again to retry.",
      noReader: "Could not reach the comment reader.", needCabinet: "Open this app inside Cabinet to read comments.",
      noReach: "This page could not reach Cabinet.", noFolder: "Could not read {dir}."
    },
    hi: {
      sub: "किसी भी YouTube वीडियो के वो कमेंट जो आपके काम के हैं।", home: "← क्रिएटर हब", urlPh: "YouTube लिंक पेस्ट कीजिए", read: "कमेंट पढ़िए",
      question: "जवाब देने लायक सवाल", idea: "वीडियो आइडिया", feedback: "फ़ीडबैक", business: "कोलैब और बिज़नेस", superfan: "सुपरफ़ैन", criticism: "जवाब देने लायक आलोचना",
      positive: "सकारात्मक", mixed: "मिली-जुली", negative: "नकारात्मक",
      readingTitle: "टॉप कमेंट पढ़ रहे हैं", readingBody: "300 तक कमेंट ला रहे हैं और जवाब देने लायक कमेंट चुन रहे हैं। इसमें एक-दो मिनट लगते हैं।",
      emptyTitle: "अभी तक कोई वीडियो नहीं पढ़ा गया", emptyBody: "ऊपर YouTube लिंक पेस्ट कीजिए और कमेंट पढ़िए दबाइए।",
      views: "व्यूज़", commentsRead: "कमेंट पढ़े", worth: "आपके काम के", all: "सभी", likes: "{n} लाइक",
      english: "अंग्रेज़ी", replyLabel: "आप यह जवाब दे सकते हैं", copy: "कॉपी", copied: "जवाब कॉपी हो गया", openVideo: "YouTube पर वीडियो खोलिए",
      asking: "दर्शक कौन से वीडियो माँग रहे हैं", talk: "वे किस बारे में बात करते हैं", askFor: "{n} कमेंट यह माँग रहे हैं",
      onIt: "Comment Reader काम पर लग गया है। बगल वाली चैट में उसे काम करते देखिए।",
      stillOn: "Comment Reader अभी काम कर रहा है। नतीजा आते ही यहीं खुलेगा।",
      stopped: "यह रीडिंग पूरी होने से पहले रुक गई। लिंक फिर से पेस्ट करके दोबारा कोशिश कीजिए।",
      noReader: "Comment Reader तक नहीं पहुँच पाए।", needCabinet: "कमेंट पढ़ने के लिए यह ऐप Cabinet में खोलिए।",
      noReach: "यह पेज Cabinet तक नहीं पहुँच पाया।", noFolder: "{dir} नहीं पढ़ पाए।"
    }
  };
  function readLang() { try { return localStorage.getItem(LANG_KEY) === "hi" ? "hi" : "en"; } catch (e) { return "en"; } }
  var ui = readLang();
  function t(key, vars) {
    var s = STR[ui][key] != null ? STR[ui][key] : STR.en[key];
    return typeof s === "string" && vars ? s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; }) : s;
  }
  var lang = ui;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  function num(n) {
    n = Number(n) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
    return String(n);
  }
  function videoId(raw) {
    var m = String(raw || "").trim().match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/live\/|\/embed\/)([\w-]{11})/);
    return m ? m[1] : null;
  }
  function thumb(id) { return "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg"; }
  function toast(t) {
    var el = $("toast"); el.textContent = t; el.classList.add("show");
    clearTimeout(toast.h); toast.h = setTimeout(function () { el.classList.remove("show"); }, 1700);
  }
  var PENDING_KEY = "india-creators-2026:comment-reader:pending";
  /* The run being waited on outlives this page, so leaving for the hub and coming back restores it. */
  var STALE_MS = 10 * 60 * 1000;
  function savePending(p) {
    try { if (p) localStorage.setItem(PENDING_KEY, JSON.stringify(p)); else localStorage.removeItem(PENDING_KEY); }
    catch (e) { /* sealed frame: the wait lasts this visit only */ }
  }
  function readPending() { try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "null"); } catch (e) { return null; } }
  function setPending(p) { pending = p; savePending(p); syncGo(); }
  function landedAfter(item) { return pending && Date.parse(item.writtenAt || 0) >= Date.parse(pending.at) - 5000; }
  function setNote(t, err) { $("note").textContent = t; $("note").className = "note" + (err ? " err" : ""); }

  /* ---------- Data ---------- */
  function load() {
    if (!c || !c.files) { render(); return; }
    c.files.list(DIR).then(function (entries) {
      var files = entries.filter(function (f) { return !f.isDir && /\.json$/.test(f.name); });
      return Promise.all(files.map(function (f) {
        return c.files.read(f.path).then(function (t) {
          try { var d = JSON.parse(t); d.id = d.id || f.name.replace(/\.json$/, ""); d.writtenAt = f.modified; return d; }
          catch (e) { return null; }
        }, function () { return null; });
      }));
    }).then(function (all) {
      var next = all.filter(Boolean).sort(function (a, b) { return Date.parse(b.writtenAt || 0) - Date.parse(a.writtenAt || 0); });
      var fresh = null;
      if (seen) next.forEach(function (a) { if (!seen[a.id] && !fresh) fresh = a.id; });
      seen = {}; next.forEach(function (a) { seen[a.id] = true; });
      list = next;
      var landed = pending ? next.filter(function (a) { return a.id === pending.id && landedAfter(a); })[0] : null;
      if (landed) { fresh = landed.id; setPending(null); setNote(""); }
      if (fresh) { selected = fresh; filter = "all"; }
      if (!selected && list.length) selected = list[0].id;
      render();
    }, function (err) { setNote(err && err.message ? err.message : t("noFolder", { dir: DIR }), true); });
  }

  /* ---------- Composer ---------- */
  $("url").addEventListener("input", syncGo);
  function syncGo() {
    var id = videoId($("url").value);
    $("go").disabled = !id || !!pending;
    $("peek").style.backgroundImage = id ? "url('" + thumb(id) + "')" : "";
    $("peek").classList.toggle("on", !!id);
  }
  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var raw = $("url").value.trim();
    var id = videoId(raw);
    if (!id || pending) return;
    if (!c || !c.ask) { setNote(t("needCabinet"), true); return; }
    var url = "https://www.youtube.com/watch?v=" + id;
    setPending({ id: id, url: url, at: new Date().toISOString() });
    selected = null;
    render();
    setNote(t("onIt"));
    c.ask("Read the comments on this YouTube video and write " + DIR + "/" + id + ".json exactly as your instructions describe, then reply in one line.\n\nVideo: " + url, { agent: "comment-reader" })
      .then(function () { $("url").value = ""; syncGo(); }, function (err) {
        setPending(null); render();
        setNote(err && err.message ? err.message : t("noReader"), true);
      });
  });

  /* ---------- Render ---------- */
  function render() {
    $("history").innerHTML = list.map(function (a) {
      return '<button class="hist' + (a.id === selected ? " on" : "") + '" data-pick="' + esc(a.id) + '">' +
        '<div class="th" style="background-image:url(\'' + esc(a.thumbnail || thumb(a.id)) + '\')"></div>' +
        '<div class="ht">' + esc(a.title) + '</div><div class="hm">' + esc(a.channel) + "</div></button>";
    }).join("");

    if (pending) {
      $("view").innerHTML = '<div class="pending"><div class="th" style="background-image:url(\'' + thumb(pending.id) + '\')"></div>' +
        "<div><h3>" + t("readingTitle") + "</h3><p>" + t("readingBody") + "</p></div></div>";
      return;
    }
    var a = list.filter(function (x) { return x.id === selected; })[0];
    if (!a) {
      $("view").innerHTML = '<div class="empty"><b>' + t("emptyTitle") + "</b>" + t("emptyBody") + "</div>";
      return;
    }
    $("view").innerHTML = resultHtml(a);
  }

  function highlight(text, h) {
    var t = esc(text), hh = esc(h || "");
    return hh && t.indexOf(hh) >= 0 ? t.replace(hh, "<mark>" + hh + "</mark>") : t;
  }

  function resultHtml(a) {
    var comments = a.comments || [];
    var counts = {};
    comments.forEach(function (cm) { counts[cm.category] = (counts[cm.category] || 0) + 1; });
    var shown = filter === "all" ? comments : comments.filter(function (cm) { return cm.category === filter; });
    var mood = a.mood || {};

    var chips = '<button class="chip' + (filter === "all" ? " on" : "") + '" data-filter="all">' + t("all") + ' <small>' + comments.length + "</small></button>" +
      Object.keys(CATS).filter(function (k) { return counts[k]; }).map(function (k) {
        return '<button class="chip' + (filter === k ? " on" : "") + '" data-filter="' + k + '" style="--c:' + CATS[k].c + '"><i></i>' + t(k) + " <small>" + counts[k] + "</small></button>";
      }).join("");

    var cards = shown.map(function (cm, i) {
      var cat = CATS[cm.category] || CATS.feedback;
      var name = String(cm.author || "?").replace(/^@/, "");
      return '<article class="cm" style="--c:' + cat.c + ";animation-delay:" + Math.min(i * 60, 600) + 'ms">' +
        '<div class="cm-h"><span class="av">' + esc(name.charAt(0).toUpperCase()) + '</span><span class="who">' + esc(cm.author) + "</span>" +
        '<span class="when">' + esc(cm.when || "") + '</span><span class="cat">' + t(CATS[cm.category] ? cm.category : "feedback") + '</span><span class="likes">' + t("likes", { n: num(cm.likes) }) + "</span></div>" +
        '<div class="cm-t">' + highlight(cm.text, cm.highlight) + "</div>" +
        (cm.text_en ? '<div class="tr"><b>' + t("english") + "</b>" + esc(cm.text_en) + "</div>" : "") +
        (cm.why ? '<div class="why">' + esc(cm.why) + "</div>" : "") +
        (cm.reply ? '<div class="reply"><div><b>' + t("replyLabel") + "</b>" + esc(cm.reply) + '</div><button class="copy" data-copy="' + esc(cm.reply) + '">' + t("copy") + "</button></div>" : "") +
        "</article>";
    }).join("");

    var themes = (a.themes || []).map(function (th) {
      return '<div class="theme"><div class="theme-h">' + esc(th.label) + "<span>" + esc(th.share) + '%</span></div><div class="bar"><i style="width:' + Math.max(2, Math.min(100, Number(th.share) || 0)) + '%"></i></div>' +
        (th.note ? "<p>" + esc(th.note) + "</p>" : "") + "</div>";
    }).join("");
    var ideas = (a.ideas || []).map(function (x) {
      return '<div class="idea"><div class="idea-t">' + esc(x.title) + "</div>" + (x.why ? "<p>" + esc(x.why) + "</p>" : "") +
        (x.comments ? "<small>" + t("askFor", { n: esc(x.comments) }) + "</small>" : "") + "</div>";
    }).join("");

    return '<div class="result">' +
      '<section class="video"><div class="bg" style="background-image:url(\'' + esc(a.thumbnail || thumb(a.id)) + '\')"></div>' +
        '<a class="th" href="' + esc(a.url) + '" target="_blank" rel="noopener" style="background-image:url(\'' + esc(a.thumbnail || thumb(a.id)) + '\')" aria-label="' + t("openVideo") + '"></a>' +
        '<div class="meta"><div><div class="ch">' + esc(a.channel) + (a.published ? " · " + esc(a.published) : "") + "</div><h2>" + esc(a.title) + "</h2></div>" +
          '<div class="stats"><div class="stat"><b>' + num(a.views) + '</b><span>' + t("views") + '</span></div><div class="stat"><b>' + num(a.commentsRead) + "</b><span>" + t("commentsRead") + '</span></div><div class="stat"><b>' + comments.length + "</b><span>" + t("worth") + "</span></div></div>" +
          '<div><div class="mood">' + ["positive", "mixed", "negative"].map(function (k) { return '<i style="width:' + (Number(mood[k]) || 0) + "%;background:" + MOOD[k] + '"></i>'; }).join("") + "</div>" +
          '<div class="mood-key">' + ["positive", "mixed", "negative"].map(function (k) { return '<em style="--c:' + MOOD[k] + '">' + t(k) + " " + (Number(mood[k]) || 0) + "%</em>"; }).join("") + "</div></div>" +
        "</div></section>" +
      '<section class="summary"><p class="' + (lang === "hi" ? "hi" : "") + '">' + esc(lang === "hi" && a.summary_hi ? a.summary_hi : a.summary) + "</p>" +
        '<div class="lang"><button data-lang="en" class="' + (lang === "en" ? "on" : "") + '">English</button><button data-lang="hi" class="' + (lang === "hi" ? "on" : "") + '">हिन्दी</button></div></section>' +
      '<div class="cols"><section><div class="filters">' + chips + '</div><div class="comments">' + cards + "</div></section>" +
        '<aside class="side">' +
          (ideas ? '<div class="panel"><h3>' + t("asking") + "</h3>" + ideas + "</div>" : "") +
          (themes ? '<div class="panel"><h3>' + t("talk") + "</h3>" + themes + "</div>" : "") +
        "</aside></div></div>";
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", function (e) {
    var pick = e.target.closest("[data-pick]");
    if (pick) { selected = pick.getAttribute("data-pick"); filter = "all"; render(); return; }
    var f = e.target.closest("[data-filter]");
    if (f) { filter = f.getAttribute("data-filter"); render(); return; }
    var l = e.target.closest("[data-lang]");
    if (l) { lang = l.getAttribute("data-lang"); render(); return; }
    var cp = e.target.closest("[data-copy]");
    if (cp) { copy(cp.getAttribute("data-copy")); return; }
  });
  $("home").addEventListener("click", function (e) {
    e.preventDefault();
    var here = c && c.here ? c.here() : null;
    var url = "/workspace/" + (here && here.cabinetPath ? here.cabinetPath : "india-creators-2026");
    try { window.top.history.pushState(null, "", url); } catch (err) { window.top.location.href = url; }
  });

  function copy(text) {
    var done = function () { toast(t("copied")); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { if (fallbackCopy(text)) done(); });
    else if (fallbackCopy(text)) done();
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove(); return ok;
  }

  /* ---------- Language switch ---------- */
  function applyStatic() {
    document.documentElement.lang = ui;
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t(el.getAttribute("data-t")); });
    document.querySelectorAll("[data-t-ph]").forEach(function (el) { el.placeholder = t(el.getAttribute("data-t-ph")); });
    document.querySelectorAll(".langs [data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === ui)); });
  }
  function switchTo(next) { ui = next; lang = next; applyStatic(); render(); }
  document.querySelector(".langs").addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]");
    if (!b) return;
    e.stopPropagation();
    if (b.getAttribute("data-lang") === ui) return;
    try { localStorage.setItem(LANG_KEY, b.getAttribute("data-lang")); } catch (err) { /* sealed frame: this visit only */ }
    switchTo(b.getAttribute("data-lang"));
  });
  window.addEventListener("storage", function (e) { if (e.key === LANG_KEY) switchTo(readLang()); });
  applyStatic();

  /* ---------- Start ---------- */
  function expireIfStale() {
    if (!pending || Date.now() - Date.parse(pending.at) < STALE_MS) return false;
    setPending(null);
    setNote(t("stopped"), true);
    return true;
  }
  pending = readPending();
  if (!expireIfStale() && pending) setNote(t("stillOn"));
  syncGo();
  setInterval(function () { if (pending && expireIfStale()) render(); }, 30000);
  if (c && c.ready) {
    c.ready.then(function () { load(); c.files.onChange(DIR, load); }, function () { setNote(t("noReach"), true); });
  } else {
    render();
    setNote(t("needCabinet"), true);
  }
})();
</script>
</body>
</html>
